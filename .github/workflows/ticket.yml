name: Ticket de compra

on:
  workflow_dispatch:
  schedule:
    # todos los días a las 00:30 UTC
    - cron: "30 0 * * *"
  push:
    # solo en main, para que el bot no haga commits en otras ramas
    # y no aparezcan conflictos con las imágenes al fusionar
    branches: [main]
    paths:
      - scripts/generate-ticket.js
      - .github/workflows/ticket.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright y fuentes
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-color-emoji

      - name: Generar ticket
        run: node scripts/generate-ticket.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar imágenes del README"
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            git push
            exit 0
          fi
          git push --force origin HEAD:refs/heads/bot/imagenes
          if [ -z "$(gh pr list --head bot/imagenes --state open --json number -q '.[0].number')" ]; then
            gh pr create --base main --head bot/imagenes --title "Actualizar imágenes del README" --body "Imágenes regeneradas por el workflow."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
